<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BES:PDFRAG_Chat </title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Tab Navigation -->
        <div class="mb-4">
            <div class="flex border-b">
                <button class="py-2 px-4 text-blue-500 border-b-2 border-blue-500 tab-btn active" onclick="switchTab('chat')">Chat</button>
                <button class="py-2 px-4 hover:text-blue-500 tab-btn" onclick="switchTab('history')">History</button>
                <button class="py-2 px-4 hover:text-blue-500 tab-btn" onclick="switchTab('system-prompt')">System Prompt</button>
            </div>
        </div>

        <!-- Chat Tab -->
        <div id="chat-tab" class="tab-content">
            <!-- File Upload -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 class="text-xl font-semibold mb-4">BES:PDFRAG_Chat</h2>
                <form id="uploadForm" class="space-y-4">
                    <div class="flex items-center space-x-4">
                        <input type="file" accept=".pdf" class="border p-2 rounded" id="pdfFile" name="file">
                        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Upload</button>
                    </div>
                    <div id="uploadStatus" class="text-sm"></div>
                </form>
            </div>

            <!-- Chat Interface -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="mb-4">
                    <select id="collectionSelect" class="w-full p-2 border rounded mb-4">
                        <option value="">Choose PDF:</option>
                        {% for collection in collections %}
                        <option value="{{ collection.collection_name }}" data-pc="{{ collection.pages_count }}">
                            {{ collection.filename }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Chat Messages -->
                <div id="chatMessages" class="h-96 overflow-y-auto mb-4 p-4 border rounded">
                    <div class="space-y-4">
                        <!-- Messages will be inserted here -->
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="flex space-x-2">
                    <input type="text" id="chatInput" class="flex-1 p-2 border rounded" 
                           placeholder="Ask about the document...">
                    <button onclick="sendMessage()" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                        Send
                    </button>
                </div>
            </div>
        </div>

        <!-- History Tab -->
        <div id="history-tab" class="tab-content hidden">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Conversation History</h2>
                <div id="historyMessages" class="h-[32rem] overflow-y-auto space-y-4">
                    <!-- History messages will be inserted here -->
                </div>
            </div>
        </div>

        <!-- System Prompt Tab -->
        <div id="system-prompt-tab" class="tab-content hidden">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">System Prompt Configuration</h2>
                <textarea id="systemPrompt" rows="10" class="w-full p-2 border rounded mb-4"></textarea>
                <button onclick="updateSystemPrompt()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Update Prompt
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentHistory = [];

        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('text-blue-500', 'border-b-2', 'border-blue-500'));
            
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');
            event.currentTarget.classList.add('text-blue-500', 'border-b-2', 'border-blue-500');

            if (tabName === 'history') {
                loadHistory();
            }
        }

        // Load Conversation History
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const data = await response.json();
                currentHistory = data.history;
                displayHistory();
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Display History
        function displayHistory() {
            const historyDiv = document.getElementById('historyMessages');
            historyDiv.innerHTML = '';

            currentHistory.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'border-b pb-4 mb-4';
                
                const timestamp = new Date(msg.timestamp).toLocaleString();
                const pagesUsed = msg.pages_used.length ? `Pages used: ${msg.pages_used.join(', ')}` : '';
                
                messageDiv.innerHTML = `
                    <div class="text-sm text-gray-500 mb-1">${timestamp}</div>
                    <div class="font-medium mb-2">Q: ${msg.query}</div>
                    <div class="pl-4 border-l-4 border-blue-500">A: ${msg.response}</div>
                    ${pagesUsed ? `<div class="text-sm text-gray-500 mt-2">${pagesUsed}</div>` : ''}
                `;
                
                historyDiv.appendChild(messageDiv);
            });

            // Scroll to bottom
            historyDiv.scrollTop = historyDiv.scrollHeight;
        }

        // File Upload
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('uploadStatus');

            formData.append('file', fileInput.files[0]);
            statusDiv.textContent = 'Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    statusDiv.textContent = 'File uploaded successfully!';
                    location.reload();
                } else {
                    statusDiv.textContent = `Error: ${data.error}`;
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
            }
        };

        // Chat Functions
        async function sendMessage() {
            const collection = document.getElementById('collectionSelect').value;
            const input = document.getElementById('chatInput');
            const query = input.value;
            const chatMessages = document.getElementById('chatMessages');

            if (!collection || !query) return;

            // Add user message
            appendMessage('user', query);
            input.value = '';

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, collection })
                });

                const data = await response.json();
                if (response.ok) {
                    appendMessage('assistant', data.response);
                } else {
                    appendMessage('error', `Error: ${data.error}`);
                }
            } catch (error) {
                appendMessage('error', `Error: ${error.message}`);
            }
        }

        function appendMessage(role, content) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `p-3 rounded ${role === 'user' ? 'bg-blue-100 ml-12' : 'bg-gray-100 mr-12'}`;
            messageDiv.innerHTML = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Handle Enter key in chat input
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // System Prompt
        async function updateSystemPrompt() {
            const prompt = document.getElementById('systemPrompt').value;
            try {
                const response = await fetch('/update_prompt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });

                if (response.ok) {
                    alert('System prompt updated successfully!');
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Initialize system prompt
        fetch('/get_prompt')
            .then(response => response.json())
            .then(data => {
                document.getElementById('systemPrompt').value = data.prompt;
            });

        // Load initial history
        loadHistory();
    </script>
</body>
</html>
