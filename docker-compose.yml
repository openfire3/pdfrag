version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USER}  # Используем переменную из .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Используем переменную из .env
      POSTGRES_DB: ${DB_NAME}  # Используем переменную из .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"  # Пробрасываем порт Qdrant
    volumes:
      - qdrant_data:/qdrant/storage  # Том для хранения данных Qdrant

volumes:
  postgres_data:
  qdrant_data: